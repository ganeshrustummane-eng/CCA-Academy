# Original seed questions (not real exam items). Add more via the question generator or PRs.
questions:
  - id: q-1.1-a
    task: "1.1"
    scenario: Customer Support Agent
    stem: An agent loop ends whenever response.content[0].type == "text". Users report it stops mid-task after the model writes a short note before calling a tool. What is the correct fix?
    options:
      A: Branch on stop_reason; continue while it is tool_use and stop on end_turn.
      B: Raise the maximum iteration count.
      C: Search the text for phrases like "task complete".
      D: Make the system prompt forbid text before tool calls.
    answer: A
    why:
      A: stop_reason is the designed signal; text can accompany tool_use.
      B: A cap does not fix the wrong completion signal.
      C: Natural-language parsing is unreliable.
      D: Probabilistic, and the bug stays in the code.
  - id: q-1.1-b
    task: "1.1"
    scenario: Customer Support Agent
    stem: After executing a requested tool, what must the loop do before the next API call?
    options:
      A: Discard the tool call to save tokens.
      B: Append the tool result to the conversation history.
      C: Start a fresh conversation with a summary.
      D: Ask the user to confirm the result.
    answer: B
    why:
      A: The model needs its own tool call in history.
      B: Results must be in history so the model can reason on them.
      C: Unnecessary and lossy.
      D: Adds friction with no benefit.
  - id: q-1.2-a
    task: "1.2"
    scenario: Multi-Agent Research
    stem: A research report on "AI in creative industries" covers only visual arts. Search and synthesis agents ran correctly on their assignments. Where is the root cause?
    options:
      A: The synthesis agent should add missing topics.
      B: The search agent needs a larger result limit.
      C: The coordinator's task decomposition was too narrow.
      D: The document-analysis agent lacks tools.
    answer: C
    why:
      A: Synthesis can only use what it was given.
      B: More results on the same narrow topic do not add music or film.
      C: The coordinator defined the subtopics.
      D: Tools were not the issue.
  - id: q-1.2-b
    task: "1.2"
    scenario: Multi-Agent Research
    stem: A synthesis subagent ignores earlier search results the coordinator saw. Why?
    options:
      A: Subagents inherit history only for the first call.
      B: Shared memory expires after one minute.
      C: The synthesis agent needs more tools.
      D: Subagents have isolated context; findings must be passed in their prompt.
    answer: D
    why:
      A: No automatic inheritance.
      B: There is no shared memory.
      C: Tools do not carry context.
      D: Everything must be explicit in the prompt.
  - id: q-1.3-a
    task: "1.3"
    scenario: Multi-Agent Research
    stem: The final report has claims with no source. The search and analysis agents work correctly. What is the most likely cause?
    options:
      A: Findings were passed as plain prose without source metadata.
      B: The synthesis model is too small.
      C: Too many subagents ran in parallel.
      D: The coordinator used auto tool_choice.
    answer: A
    why:
      A: Structured claim-source mappings must travel with the content.
      B: Not a size problem.
      C: Parallelism does not remove metadata.
      D: Unrelated.
  - id: q-1.3-b
    task: "1.3"
    scenario: Multi-Agent Research
    stem: Three independent searches are needed. How should the coordinator spawn them for the lowest latency?
    options:
      A: One Task call per turn.
      B: Multiple Task calls in a single response.
      C: A single subagent doing all three sequentially.
      D: Ask the user to start them.
    answer: B
    why:
      A: Serial and slower.
      B: Parallel spawning in one response.
      C: Serial inside one agent.
      D: Not agentic.
  - id: q-1.4-a
    task: "1.4"
    scenario: Customer Support Agent
    stem: In 8% of cases the agent issues refunds before verifying account ownership. Which fix is correct?
    options:
      A: Few-shot examples of verification.
      B: A stronger system prompt reminding it to verify.
      C: A prerequisite gate that blocks process_refund until verification succeeds.
      D: A classifier that routes refund requests.
    answer: C
    why:
      A: Probabilistic.
      B: Probabilistic.
      C: Programmatic enforcement works every time.
      D: Routing does not enforce ordering.
  - id: q-1.4-b
    task: "1.4"
    scenario: Customer Support Agent
    stem: What must an escalation handoff contain, given the human cannot see the transcript?
    options:
      A: Only the customer ID.
      B: A link to the raw chat log.
      C: The agent's confidence score.
      D: A self-contained summary with customer ID, issue, root cause, amount and recommended action.
    answer: D
    why:
      A: Not enough context.
      B: The human lacks transcript access.
      C: Confidence is unreliable and incomplete.
      D: Handoffs must stand alone.
  - id: q-1.5-a
    task: "1.5"
    scenario: Customer Support Agent
    stem: Refunds above $500 must always go to a human. Where should this live?
    options:
      A: In a pre-execution tool-call hook that blocks and redirects.
      B: In the system prompt as a rule.
      C: In a few-shot example.
      D: In the user's first message.
    answer: A
    why:
      A: Hooks give deterministic guarantees.
      B: Not guaranteed.
      C: Not guaranteed.
      D: Not controllable.
  - id: q-1.6-a
    task: "1.6"
    scenario: CI/CD
    stem: A 14-file single-pass review gives deep feedback on some files and misses obvious bugs in others. Best remedy?
    options:
      A: Use a larger context window only.
      B: Per-file passes plus a separate cross-file integration pass.
      C: Ask the model to "be thorough".
      D: Review only the first five files.
    answer: B
    why:
      A: Context size does not fix attention dilution.
      B: Consistent per-file depth, then data-flow checks.
      C: Vague.
      D: Drops coverage.
  - id: q-1.7-a
    task: "1.7"
    scenario: Developer Productivity
    stem: You resume a session after editing three files and the agent contradicts itself about them. Best approach?
    options:
      A: Resume and ignore the contradictions.
      B: Delete the three files.
      C: Start fresh with an injected summary and name the changed files for re-analysis.
      D: Increase temperature.
    answer: C
    why:
      A: Stale tool results persist.
      B: Destructive.
      C: Fresh summary plus targeted re-analysis is reliable.
      D: Irrelevant.
  - id: q-2.1-a
    task: "2.1"
    scenario: Customer Support Agent
    stem: get_customer and lookup_order both say "Retrieves information" and are constantly confused. What is the best first step?
    options:
      A: Add a routing classifier.
      B: Merge both tools into one.
      C: Add several few-shot examples.
      D: Expand each description with purpose, inputs, examples and boundaries.
    answer: D
    why:
      A: Over-engineered first step.
      B: High effort.
      C: Treats a symptom with token overhead.
      D: Descriptions drive selection.
  - id: q-2.2-a
    task: "2.2"
    scenario: Customer Support Agent
    stem: A lookup returns an empty array. The agent retries three times then escalates, but the account simply does not exist. What went wrong?
    options:
      A: It treated a valid empty result as an access failure.
      B: The timeout was too short.
      C: The model temperature was too high.
      D: The database was down.
    answer: A
    why:
      A: Empty success is the answer; do not retry.
      B: No evidence of timeout.
      C: Unrelated.
      D: Then it would be an error, not an empty success.
  - id: q-2.2-b
    task: "2.2"
    scenario: Customer Support Agent
    stem: A refund exceeds policy limits. Which error category and retry flag?
    options:
      A: Transient, retryable.
      B: Business, not retryable.
      C: Validation, retryable.
      D: Permission, retryable.
    answer: B
    why:
      A: Retrying will not change the policy.
      B: Policy violations are non-retryable and need an alternative workflow.
      C: Input is valid.
      D: Not an access issue.
  - id: q-2.3-a
    task: "2.3"
    scenario: Multi-Agent Research
    stem: A synthesis agent returns to the coordinator for simple fact checks, adding latency. 85% are simple lookups. Best design?
    options:
      A: Give it all web search tools.
      B: Remove verification.
      C: Give it a scoped verify_fact tool; route complex cases through the coordinator.
      D: Batch all verifications at the end.
    answer: C
    why:
      A: Tool overload and role blur.
      B: Hurts quality.
      C: Constrained tool handles the common case.
      D: Delays and complicates.
  - id: q-2.3-b
    task: "2.3"
    scenario: Structured Extraction
    stem: Documents come in unknown types, each with its own extraction tool. You need structured output every time. Which tool_choice?
    options:
      A: auto
      B: Forced to one named tool
      C: none
      D: any
    answer: D
    why:
      A: May return text.
      B: Wrong for unknown types.
      C: No tools.
      D: Must call a tool and may pick the matching schema.
  - id: q-2.4-a
    task: "2.4"
    scenario: Developer Productivity
    stem: How should a shared .mcp.json handle a GitHub token?
    options:
      A: Use ${GITHUB_TOKEN} expansion; each developer sets it locally.
      B: Paste the token in the file.
      C: Put the token in CLAUDE.md.
      D: Commit it to a private branch.
    answer: A
    why:
      A: Keeps secrets out of version control.
      B: Leaks secrets in git.
      C: Also committed.
      D: Still stored in git.
  - id: q-2.5-a
    task: "2.5"
    scenario: Developer Productivity
    stem: Find every caller of a deprecated function. Which tool?
    options:
      A: Glob
      B: Grep
      C: Edit
      D: Read all files
    answer: B
    why:
      A: Matches paths not contents.
      B: Searches file contents.
      C: Modifies files.
      D: Burns context.
  - id: q-3.1-a
    task: "3.1"
    scenario: Code Generation
    stem: Developer A gets consistent API naming; new hire B does not. Same repo. Likely cause?
    options:
      A: The repo is too large.
      B: B uses a different OS.
      C: Conventions live in A's user-level ~/.claude/CLAUDE.md.
      D: B needs more tokens.
    answer: C
    why:
      A: Irrelevant.
      B: Irrelevant.
      C: User-level config is not shared via git.
      D: Irrelevant.
  - id: q-3.2-a
    task: "3.2"
    scenario: Code Generation
    stem: A skill produces very verbose output that clutters the main chat. Which frontmatter helps?
    options:
      A: none
      B: argument-hint
      C: allowed-tools
      D: context fork
    answer: D
    why:
      A: There is a solution.
      B: Prompts for arguments.
      C: Restricts tools.
      D: Runs in an isolated subagent context.
  - id: q-3.3-a
    task: "3.3"
    scenario: Code Generation
    stem: Test files live beside source across 50+ directories and must follow one convention. Best option?
    options:
      A: A .claude/rules file with paths glob **/*.test.*
      B: A CLAUDE.md in each directory.
      C: A single always-loaded root CLAUDE.md with all rules.
      D: A skill invoked manually.
    answer: A
    why:
      A: Globs span the codebase and load only when relevant.
      B: Maintenance burden.
      C: Always loaded, wasteful.
      D: Easy to forget.
  - id: q-3.4-a
    task: "3.4"
    scenario: Code Generation
    stem: Which task is best suited to plan mode?
    options:
      A: Fix a null check in one function.
      B: Migrate a logging library across 40 files.
      C: Rename a local variable.
      D: Add a missing semicolon.
    answer: B
    why:
      A: Direct execution.
      B: Multi-file with design choices.
      C: Direct execution.
      D: Direct execution.
  - id: q-3.5-a
    task: "3.5"
    scenario: Code Generation
    stem: Claude interprets your prose description of a transformation differently each time. What first?
    options:
      A: Write a longer description.
      B: Switch models.
      C: Provide 2-3 concrete input/output examples.
      D: Repeat the request in capitals.
    answer: C
    why:
      A: Same ambiguity.
      B: Unnecessary.
      C: Examples generalise reliably.
      D: No effect.
  - id: q-3.6-a
    task: "3.6"
    scenario: CI/CD
    stem: A CI job running claude "Analyze this PR" hangs. What fixes it?
    options:
      A: Run it twice.
      B: Increase job timeout.
      C: Pipe yes into it.
      D: Add the -p flag for non-interactive mode.
    answer: D
    why:
      A: Same issue.
      B: Still hangs.
      C: Hacky.
      D: Print mode runs non-interactively.
  - id: q-4.1-a
    task: "4.1"
    scenario: CI/CD
    stem: A review bot has many false positives and developers ignore it. Which change works best?
    options:
      A: Define categories to report vs skip with code examples; disable the noisiest category meanwhile.
      B: Add "be conservative" to the prompt.
      C: Ask for confidence scores and filter below 0.9.
      D: Review fewer PRs.
    answer: A
    why:
      A: Explicit criteria restore trust.
      B: Vague.
      C: Self-reported confidence is poorly calibrated.
      D: Avoids the problem.
  - id: q-4.2-a
    task: "4.2"
    scenario: Structured Extraction
    stem: Extraction leaves fields null even when the data exists in odd layouts. Best remedy?
    options:
      A: Longer instructions only.
      B: Few-shot examples showing varied document structures.
      C: Lower temperature.
      D: Larger batch sizes.
    answer: B
    why:
      A: Less effective than examples.
      B: Examples teach layout handling.
      C: Does not teach layouts.
      D: Unrelated.
  - id: q-4.3-a
    task: "4.3"
    scenario: Structured Extraction
    stem: A source lacks a field marked required in the schema; the model invents a value. Schema fix?
    options:
      A: Retry until it is filled.
      B: Add a stricter regex.
      C: Make the field nullable/optional.
      D: Remove validation.
    answer: C
    why:
      A: Encourages fabrication.
      B: Invented values may still match.
      C: Allows honest absence and prevents fabrication.
      D: Worse.
  - id: q-4.4-a
    task: "4.4"
    scenario: Structured Extraction
    stem: Which failure can a validation-retry loop fix?
    options:
      A: Information absent from the source.
      B: A missing document.
      C: A scanned page that is blank.
      D: A value placed in the wrong field.
    answer: D
    why:
      A: Retry cannot create data.
      B: No data.
      C: No data.
      D: Format and placement errors are fixable with feedback.
  - id: q-4.5-a
    task: "4.5"
    scenario: CI/CD
    stem: A manager wants all review workloads moved to the Batch API for 50% savings. What is the correct response?
    options:
      A: Batch the overnight reports only; keep blocking pre-merge checks synchronous.
      B: Agree; move everything.
      C: Use batch with multi-turn tool calls.
      D: Reject batch entirely.
    answer: A
    why:
      A: Match latency tolerance to API.
      B: Batch has no latency guarantee.
      C: Multi-turn tool calling is not supported in batch.
      D: Overnight jobs benefit.
  - id: q-4.6-a
    task: "4.6"
    scenario: CI/CD
    stem: Why use an independent instance to review generated code?
    options:
      A: It is cheaper.
      B: The generating session retains reasoning that makes it less likely to question itself.
      C: It runs faster.
      D: It avoids using tools.
    answer: B
    why:
      A: Not the reason.
      B: Fresh context catches subtler issues.
      C: Not the reason.
      D: Not the reason.
  - id: q-5.1-a
    task: "5.1"
    scenario: Customer Support Agent
    stem: After long chats the agent forgets that the refund is $247.83 for order 8891. What mitigation?
    options:
      A: Shorter replies.
      B: More aggressive summarisation.
      C: A persistent case-facts block, never summarised, in each prompt.
      D: Ask the customer each time.
    answer: C
    why:
      A: Irrelevant.
      B: Makes it worse.
      C: Preserves exact transactional facts.
      D: Poor experience.
  - id: q-5.2-a
    task: "5.2"
    scenario: Customer Support Agent
    stem: A customer says "I want to speak to a human." What should the agent do?
    options:
      A: Try to resolve first.
      B: Ask for a confidence score.
      C: Run sentiment analysis first.
      D: Escalate immediately.
    answer: D
    why:
      A: Disrespects an explicit request.
      B: Unreliable trigger.
      C: Unreliable trigger.
      D: Honour immediately.
  - id: q-5.3-a
    task: "5.3"
    scenario: Multi-Agent Research
    stem: One subagent's source times out. What should the coordinator receive?
    options:
      A: A structured error with failure type, attempted query, partial results and alternatives.
      B: An empty success.
      C: Nothing; the workflow aborts.
      D: A generic "failed" string.
    answer: A
    why:
      A: Enables recovery and coverage annotations.
      B: Silent suppression.
      C: Throws away partial results.
      D: Not actionable.
  - id: q-5.4-a
    task: "5.4"
    scenario: Developer Productivity
    stem: In a long exploration the agent starts citing "typical patterns" instead of classes it found. What helps?
    options:
      A: Reading more files.
      B: Scratchpad files and delegating investigations to subagents.
      C: Restarting every minute.
      D: Disabling tools.
    answer: B
    why:
      A: Adds more noise.
      B: Preserves findings and limits noise.
      C: Loses state.
      D: Counterproductive.
  - id: q-5.5-a
    task: "5.5"
    scenario: Structured Extraction
    stem: Overall extraction accuracy is 97%. Why not automate fully?
    options:
      A: Humans are always better.
      B: 97% is always too low.
      C: The aggregate can hide a very weak document type or field.
      D: Batch cannot be used.
    answer: C
    why:
      A: Not generally true.
      B: Depends on the segment error rates.
      C: Validate by segment before automating.
      D: Unrelated.
  - id: q-5.6-a
    task: "5.6"
    scenario: Multi-Agent Research
    stem: Two credible sources give different growth figures. What should synthesis do?
    options:
      A: Pick the larger.
      B: Drop both.
      C: Average them.
      D: Present both with attribution and dates.
    answer: D
    why:
      A: Arbitrary.
      B: Loses information.
      C: Invents a number.
      D: Let the reader decide; dates may explain it.

# ---------------------------------------------------------------------------
# D1 Agentic Architecture & Orchestration — bank expansion to 5 per task.
# level: 1 foundational recall / 2 applied / 3 architectural judgement.
# Absent level means 2 (the original 36 seed questions).
# ---------------------------------------------------------------------------
  - id: q-1.1-c
    task: "1.1"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      Which stop_reason value signals that the model has requested one or more
      tools and expects the loop to execute them and call back?
    options:
      A: tool_use
      B: end_turn
      C: max_tokens
      D: stop_sequence
    answer: A
    why:
      A: tool_use is the designed signal that tools were requested.
      B: end_turn means the model considers the task finished.
      C: max_tokens means the response was cut off by the output limit.
      D: stop_sequence means a configured stop string was emitted.
  - id: q-1.1-d
    task: "1.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      Finance wants a hard ceiling on spend per conversation, but the team has
      been burned by a loop that quit mid-refund. How should both requirements
      be satisfied?
    options:
      A: Keep the iteration cap as the only stop condition and raise it until complaints stop.
      B: Branch on stop_reason for correctness and keep a generous cap purely as a runaway backstop that reports an incomplete result.
      C: Ask the model in the system prompt to use no more than ten tool calls.
      D: Stop as soon as accumulated token usage crosses the budget and return whatever text exists.
    answer: B
    why:
      A: A cap as the primary signal is exactly the bug that quit mid-refund.
      B: Correctness comes from stop_reason; the cap only bounds the pathological case and says so.
      C: A prompt request is probabilistic and gives finance no guarantee.
      D: Truncating mid-refund silently is the failure mode being complained about.
  - id: q-1.1-e
    task: "1.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      One assistant turn returns three tool_use blocks at once. The loop
      executes the first, appends its result and immediately calls the API
      again. What goes wrong?
    options:
      A: Nothing — the model will re-request the other two tools next turn.
      B: The API rejects any response containing more than one tool_use block.
      C: The history now has tool_use blocks with no matching tool_result, so the request is malformed and the dropped work is invisible.
      D: Token cost doubles because the same turn is sent twice.
    answer: C
    why:
      A: The model may re-request them, but may also proceed as if all three succeeded.
      B: Multiple tool_use blocks in one response are normal and are meant to run in parallel.
      C: Every tool_use block needs a matching tool_result in the next message.
      D: Cost is not the defect; the malformed history is.
  - id: q-1.2-c
    task: "1.2"
    level: 1
    scenario: Multi-Agent Research
    stem: >-
      In a hub-and-spoke multi-agent system, which component decomposes the
      task, delegates it and aggregates the results?
    options:
      A: Each subagent, by negotiating scope with its peers.
      B: The last subagent to finish, which collects the others' output.
      C: The tool layer, which routes calls to whichever agent is idle.
      D: The coordinator.
    answer: D
    why:
      A: Subagents have isolated context and never talk to each other.
      B: Subagents cannot see each other's results.
      C: Tools execute calls; they do not own orchestration.
      D: Decomposition, delegation and aggregation are the coordinator's job.
  - id: q-1.2-d
    task: "1.2"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      Two search subagents returned largely the same sources, and the final
      report cites one study twice under different headings. What is the most
      direct fix?
    options:
      A: Partition the coordinator's assignments so each subagent owns a disjoint slice of the question.
      B: Add a deduplication step to the synthesis agent and keep the assignments as they are.
      C: Let the two search agents exchange their result lists before synthesising.
      D: Reduce each search agent's result limit so there is less overlap.
    answer: A
    why:
      A: Overlap is a decomposition defect, so it is fixed in the partition.
      B: Deduplication hides wasted work instead of preventing it.
      C: Subagents have isolated context and cannot message each other.
      D: A smaller limit shrinks coverage without making the slices disjoint.
  - id: q-1.2-e
    task: "1.2"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A subagent prompt says to use the competitor list the pricing agent
      already gathered. The subagent returns an empty result every time. Why?
    options:
      A: The subagent lacks permission to read the pricing agent's tools.
      B: Subagent context is isolated, so anything it needs must be passed in its own prompt.
      C: Subagent prompts cannot reference another agent by name.
      D: The pricing agent must finish before any other subagent is spawned.
    answer: B
    why:
      A: Permissions are not the issue; the data simply is not in its context.
      B: Nothing is inherited, so the competitor list has to be embedded in the prompt.
      C: Naming is harmless; the referenced content is what is absent.
      D: Ordering would not help, because the result still would not be visible.
  - id: q-1.3-c
    task: "1.3"
    level: 1
    scenario: Multi-Agent Research
    stem: >-
      Which tool must appear in allowedTools before an agent can spawn
      subagents?
    options:
      A: Bash
      B: Glob
      C: Task
      D: WebFetch
    answer: C
    why:
      A: Bash runs shell commands, not subagents.
      B: Glob matches file paths.
      C: The Task tool spawns subagents and must be permitted.
      D: WebFetch retrieves a URL.
  - id: q-1.3-d
    task: "1.3"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      The final report's claims cannot be traced to any source, even though
      every search subagent returned URLs. What was most likely lost?
    options:
      A: The subagents' tool definitions, so they searched without citations.
      B: The search tool's result limit, which truncated the URLs.
      C: The coordinator's system prompt, which normally states the citation format.
      D: The structured metadata — source, page, date — dropped when findings were handed back as prose.
    answer: D
    why:
      A: URLs were returned, so the tools worked.
      B: Truncation would lose some sources, not every attribution.
      C: A format instruction cannot restore metadata that is no longer present.
      D: Provenance survives only if source metadata travels with each finding.
  - id: q-1.3-e
    task: "1.3"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      Four independent market segments need researching, and the coordinator
      issues one Task call per turn across four turns. What does this cost, and
      what is the fix?
    options:
      A: Latency is roughly four times higher than necessary — issue all four Task calls in one response so they run in parallel.
      B: Nothing is lost, because subagents always run sequentially.
      C: Context is lost between turns, so the four calls must be merged into one subagent.
      D: Each turn re-reads the coordinator's history, so the fix is a shorter system prompt.
    answer: A
    why:
      A: Independent work issued together runs concurrently.
      B: Several Task calls in one response do run in parallel.
      C: Merging four segments into one subagent dilutes attention rather than helping.
      D: Prompt length is not what serialised the work.
  - id: q-1.4-c
    task: "1.4"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      A policy says no refund above $500 may be issued without human approval.
      Where does this rule belong?
    options:
      A: In the system prompt, stated firmly and repeated.
      B: In a programmatic pre-call gate that blocks the refund tool and escalates.
      C: In a few-shot example showing a large refund being declined.
      D: In the refund tool's description, so the model knows the limit.
    answer: B
    why:
      A: Prompt wording is probabilistic and will eventually be ignored.
      B: Money rules need a deterministic gate in code.
      C: Examples shape tendency, not guarantees.
      D: A description informs the model but enforces nothing.
  - id: q-1.4-d
    task: "1.4"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      An agent escalates to a human, who replies asking what the case is about.
      The handoff payload contained only the customer's last message. What is
      missing?
    options:
      A: The full conversation transcript, which the human should read in order.
      B: A link back to the live agent session so the human can continue the chat.
      C: A self-contained packet — customer ID, issue summary, root cause, amount and recommended action.
      D: The agent's confidence score for the escalation decision.
    answer: C
    why:
      A: Humans do not read the transcript; a summary is what they act on.
      B: Resuming the session still leaves the human to reconstruct the case.
      C: A handoff must stand alone and state the decision being asked for.
      D: A self-reported score does not tell the human what to do.
  - id: q-1.4-e
    task: "1.4"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      Refunds are occasionally issued before ownership of the order is
      verified. An engineer proposes a routing classifier that detects refund
      intent and sends it down a verified path. Assess this.
    options:
      A: Sound — classification is the standard way to enforce ordering.
      B: Wrong — the verify tool should simply be listed first in the tools array.
      C: Sound, provided the classifier is trained on labelled refund requests.
      D: Wrong tool — this is an ordering constraint, so a prerequisite gate that blocks the refund tool until verification passes is smaller and deterministic.
    answer: D
    why:
      A: A classifier adds a probabilistic component to a deterministic problem.
      B: Tool order in the array does not constrain call order.
      C: Training quality does not turn a classifier into a guarantee.
      D: A prerequisite gate enforces the order in code and cannot be talked around.
  - id: q-1.5-b
    task: "1.5"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      What does a PostToolUse hook let you do?
    options:
      A: Transform or normalise the tool's output before the model sees it.
      B: Decide whether the tool should run at all.
      C: Change which tools are available on the next turn.
      D: Rewrite the user's message before the model reads it.
    answer: A
    why:
      A: PostToolUse sits between the tool result and the model.
      B: That is a pre-call hook's job.
      C: Tool availability is configuration, not a post-tool concern.
      D: The user message is not a tool result.
  - id: q-1.5-c
    task: "1.5"
    level: 2
    scenario: Customer Support Agent
    stem: >-
      Three tools return timestamps in three formats, and the model keeps
      miscomparing order dates. What is the smallest reliable fix?
    options:
      A: Tell the model in the system prompt which format each tool uses.
      B: A PostToolUse hook that normalises every timestamp to one format before the model sees it.
      C: Add a convert_timestamp tool the model can call when unsure.
      D: Ask each tool's owner to change their API.
    answer: B
    why:
      A: The model would have to apply the rule correctly every time.
      B: Normalising once in a hook removes the ambiguity deterministically.
      C: An extra tool adds a step the model may skip.
      D: Changing three upstream APIs is the largest possible fix.
  - id: q-1.5-d
    task: "1.5"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      Compliance asks for evidence that a rule held on every request last
      quarter. The rule is currently a system-prompt instruction. What changes?
    options:
      A: Nothing — export the transcripts and sample them for violations.
      B: Repeat the rule at the end of the prompt, where recall is better.
      C: Move the rule into a hook, which enforces it deterministically and produces a per-call record that it was applied.
      D: Lower the temperature so the model follows instructions consistently.
    answer: C
    why:
      A: Sampling shows what happened, not that the rule always held.
      B: Repetition improves odds and proves nothing.
      C: A hook gives both the guarantee and the audit trail compliance needs.
      D: Temperature reduces variation but offers no guarantee.
  - id: q-1.5-e
    task: "1.5"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      A refund limit is validated inside the refund tool, which returns an
      error above $500. A reviewer argues for a pre-call hook instead. What is
      the real difference?
    options:
      A: None — both block the call, so the in-tool check is simpler and should stay.
      B: In-tool validation cannot return a structured error to the model.
      C: The hook is faster because it avoids a network round trip.
      D: A hook blocks and redirects before the call happens and applies across tools, whereas in-tool validation protects one tool and only while its owner keeps it.
    answer: D
    why:
      A: In-tool checks protect only that tool, and only while its owner keeps them.
      B: Tools can and should return structured errors regardless.
      C: Latency is a minor side benefit, not the reason to choose.
      D: A hook is a policy layer outside the tool, so it survives tool changes and covers siblings.
  - id: q-1.6-b
    task: "1.6"
    level: 1
    scenario: Code Generation
    stem: >-
      Which decomposition strategy suits work whose steps are known in advance
      and repeat the same way each run?
    options:
      A: A fixed pipeline of defined stages.
      B: Adaptive decomposition, re-planned after each step.
      C: A single prompt containing all stages.
      D: One subagent per file, assigned at random.
    answer: A
    why:
      A: Predictable, repeating work is exactly what a fixed pipeline is for.
      B: Adaptive planning pays for flexibility that predictable work does not need.
      C: One prompt for all stages dilutes attention.
      D: Random assignment is not a strategy.
  - id: q-1.6-c
    task: "1.6"
    level: 2
    scenario: Code Generation
    stem: >-
      A review of 14 files in one pass reports five issues in the first two
      files and almost nothing after. What explains this?
    options:
      A: The later files are genuinely cleaner.
      B: Attention dilutes across a long input, so review depth decays and findings become inconsistent.
      C: The output token limit truncated the findings list.
      D: The model deduplicated findings it had already reported.
    answer: B
    why:
      A: Possible, but the decay tracks position rather than code quality.
      B: Long single passes give uneven depth, which is why work is split per file.
      C: Truncation would cut the end of the text, not thin the middle.
      D: Deduplication would not silence whole files.
  - id: q-1.6-d
    task: "1.6"
    level: 3
    scenario: Code Generation
    stem: >-
      Per-file review passes now give consistent depth, but a bug where one
      file writes a field another file reads with the wrong type went
      unnoticed. What is the right addition?
    options:
      A: Increase each per-file pass's budget so it can read imported files too.
      B: Go back to one pass over all 14 files.
      C: Add a separate integration pass whose only job is cross-file data flow.
      D: Ask each per-file pass to speculate about callers it cannot see.
    answer: C
    why:
      A: Letting each pass wander into imports reintroduces dilution and duplicates work.
      B: That restores the dilution problem just solved.
      C: Cross-file defects need a pass whose scope is the seams between files.
      D: Speculation without the other file produces noise.
  - id: q-1.6-e
    task: "1.6"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      An investigation starts from why Q3 churn rose, where neither the causes
      nor the number of steps is knowable up front. Which shape fits?
    options:
      A: A fixed pipeline with stages for pricing, support and product.
      B: A single long prompt describing every hypothesis to check.
      C: One subagent per department, run once in parallel, then synthesise.
      D: Adaptive decomposition — plan one layer, read the findings, then choose the next layer from what was learned.
    answer: D
    why:
      A: A fixed pipeline presumes the answer lies in the stages chosen in advance.
      B: One prompt over every hypothesis dilutes attention and still cannot follow up.
      C: A single parallel fan-out cannot follow a lead it uncovers.
      D: Open-ended questions need the next step chosen from the last step's findings.
  - id: q-1.7-b
    task: "1.7"
    level: 1
    scenario: Developer Productivity
    stem: >-
      You want to try two different refactoring approaches from the same
      analysis baseline and keep both for comparison. Which session operation
      fits?
    options:
      A: Fork the session from the baseline.
      B: Resume the session twice.
      C: Start fresh with an injected summary.
      D: Compact the session, then continue.
    answer: A
    why:
      A: Forking branches from a shared baseline, which is what comparison needs.
      B: Resuming twice continues one timeline, so the branches collide.
      C: A fresh start discards the baseline both branches should share.
      D: Compacting shortens context; it does not create branches.
  - id: q-1.7-c
    task: "1.7"
    level: 2
    scenario: Developer Productivity
    stem: >-
      An agent analysed six files yesterday. Overnight, two of them were
      rewritten. You resume the session. What should you do first?
    options:
      A: Nothing — the agent will re-read files as needed.
      B: Tell the agent exactly which files changed so it re-analyses those targeted.
      C: Ask it to re-read all six files from scratch.
      D: Start a brand new session with no context.
    answer: B
    why:
      A: It will happily reason from the stale analysis already in context.
      B: Naming the changed files makes the re-analysis targeted and cheap.
      C: Re-reading all six wastes the four that are still valid.
      D: Discarding valid analysis costs more than correcting part of it.
  - id: q-1.7-d
    task: "1.7"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A long session's context is dominated by tool results from a schema that
      has since been migrated. Resuming produces confidently wrong advice. What
      is the right move?
    options:
      A: Resume and correct each wrong statement as it appears.
      B: Fork the session so the stale branch is preserved.
      C: Start fresh and inject a written summary of the conclusions that are still true.
      D: Raise the context window limit so newer results fit alongside.
    answer: C
    why:
      A: Correcting output one claim at a time leaves the stale evidence in context.
      B: Forking carries the stale tool results into both branches.
      C: A fresh start with a curated summary keeps the conclusions and drops the stale results.
      D: More room does not stop the model reasoning from outdated results.
  - id: q-1.7-e
    task: "1.7"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A team wants crashed long-running agent runs to resume without redoing
      hours of exploration. What should the run produce as it goes?
    options:
      A: Verbose logs of every model response, kept for replay.
      B: A snapshot of the context window saved after every turn.
      C: A larger iteration cap so the run is less likely to stop.
      D: A durable manifest of findings and progress written outside the session, so a new session can be seeded from it.
    answer: D
    why:
      A: Logs record what was said without making the state reloadable.
      B: Replaying raw context restores the noise along with the findings.
      C: A bigger cap does not help a crash.
      D: Externalising findings is what lets a new session pick up the work.

# ---------------------------------------------------------------------------
# D2 Tool Design & MCP Integration
# ---------------------------------------------------------------------------
  - id: q-2.1-b
    task: "2.1"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      What is the primary mechanism the model uses to decide which tool to call?
    options:
      A: The tool description.
      B: The order the tools appear in the tools array.
      C: The number of required parameters each tool declares.
      D: Few-shot examples in the user message.
    answer: A
    why:
      A: Descriptions are the primary selection mechanism, so they carry purpose, inputs and edge cases.
      B: Array order carries no selection meaning.
      C: The schema constrains arguments, not selection.
      D: Examples can nudge behaviour but are not the selection mechanism.
  - id: q-2.1-c
    task: "2.1"
    level: 2
    scenario: Customer Support Agent
    stem: >-
      An agent keeps calling search_orders when the user asks about a shipment,
      ignoring track_shipment. What should be tried first?
    options:
      A: Add three few-shot examples of shipment questions routed correctly.
      B: Rewrite both descriptions to state when to use each one versus the other.
      C: Merge the two tools into one lookup tool with a type parameter.
      D: Add a classifier in front of the agent to pick the tool.
    answer: B
    why:
      A: Examples are a heavier fix for what is usually a description gap.
      B: Misrouting is a description problem first, including the when-not-to-use boundary.
      C: Consolidating makes selection vaguer, not sharper.
      D: A classifier adds a component to compensate for unclear descriptions.
  - id: q-2.1-d
    task: "2.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      After sharpening two tool descriptions, misrouting gets worse rather than
      better. What is the most likely cause?
    options:
      A: Descriptions have a length limit that was exceeded.
      B: Tool descriptions are cached and the old ones are still in effect.
      C: The system prompt uses keywords that now conflict with the new descriptions.
      D: Two tools cannot share any vocabulary in their descriptions.
    answer: C
    why:
      A: Length was not the constraint being hit.
      B: Descriptions travel with each request and are not cached that way.
      C: The system prompt and descriptions are read together, so keyword conflicts must be re-checked after any change.
      D: Shared vocabulary is fine when the boundary is stated.
  - id: q-2.1-e
    task: "2.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      A single query_database tool is called for order lookups, refund history
      and inventory, and arguments are frequently malformed. What is the
      structural fix?
    options:
      A: Add stricter JSON schema validation and return errors until the model gets it right.
      B: Set tool_choice to that tool so it is always called correctly.
      C: Expand the description with one example per use case.
      D: Split it into purpose-specific tools whose schemas only accept what that purpose needs.
    answer: D
    why:
      A: Validation catches the symptom on every call instead of removing the ambiguity.
      B: Forcing the call does not make its arguments correct.
      C: More examples narrow the odds; they do not narrow the schema.
      D: Purpose-specific tools make the right argument shape the only expressible one.
  - id: q-2.2-c
    task: "2.2"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      Which error category should be marked as not retryable?
    options:
      A: A business rule rejection, such as an order outside the refund window.
      B: A timeout contacting the orders service.
      C: A rate limit response.
      D: A transient connection reset.
    answer: A
    why:
      A: A business rule will reject the same request every time, so retrying wastes calls.
      B: Timeouts are transient and worth retrying.
      C: Rate limits are retryable after a delay.
      D: Connection resets are transient.
  - id: q-2.2-d
    task: "2.2"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A search tool returns an empty list for a valid query. The agent retries
      three times, then escalates saying the search is broken. What went wrong?
    options:
      A: The retry count is too low to overcome intermittent indexing delays.
      B: A valid empty result was treated as a failure; it is the answer, and only access failures are retryable.
      C: The tool should have raised an error instead of returning an empty list.
      D: The agent should have escalated immediately rather than retrying.
    answer: B
    why:
      A: More retries repeat a successful call that happens to have no matches.
      B: Distinguishing an access failure from a valid empty result is the whole point of the category field.
      C: An empty result is not an error and should not be reported as one.
      D: Escalation is also wrong, because nothing failed.
  - id: q-2.2-e
    task: "2.2"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A subagent covering three regions has one region's data source return a
      permission error. What should it hand back to the coordinator?
    options:
      A: An error for the whole assignment, so the coordinator can retry it cleanly.
      B: Only the two completed regions, since partial success is still success.
      C: The two regions it completed, plus a structured note naming the failed region, the error category and that it is not retryable without new credentials.
      D: A retry of the permission error until credentials appear.
    answer: C
    why:
      A: Discarding two-thirds of completed work to report one failure is wasteful.
      B: Silently dropping a region makes the gap invisible in the final report.
      C: Recover locally, propagate only what cannot be fixed, and carry partial results with an explicit coverage gap.
      D: Permission errors are not retryable.
  - id: q-2.3-c
    task: "2.3"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      Which tool_choice setting allows the model to answer with text and call no
      tool at all?
    options:
      A: required
      B: any
      C: A named tool
      D: auto
    answer: D
    why:
      A: There is no required option in this set.
      B: any requires that some tool be called.
      C: Naming a tool forces that specific call.
      D: auto lets the model decide, including replying with text only.
  - id: q-2.3-d
    task: "2.3"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A synthesis agent needs to confirm a single figure but has been given the
      full 18-tool research toolset and now wanders into fresh searches. What is
      the fix?
    options:
      A: Give it a scoped verify_fact tool and remove the broad research tools from its definition.
      B: Set tool_choice to any so it stops replying with text.
      C: Instruct it in the system prompt not to start new research.
      D: Lower its max_tokens so it cannot afford extra calls.
    answer: A
    why:
      A: Keeping 4 to 5 role-scoped tools per agent removes the temptation structurally.
      B: Forcing a tool call does not stop it choosing the wrong one.
      C: A prompt instruction competes with 18 available tools.
      D: Token limits truncate output rather than constrain tool choice.
  - id: q-2.3-e
    task: "2.3"
    level: 3
    scenario: Structured Extraction
    stem: >-
      A pipeline must always begin by classifying the document type before
      anything else. Which configuration expresses that?
    options:
      A: tool_choice auto, with the classifier described as the first step.
      B: tool_choice set to the classify_document tool on the first request, then auto for the rest.
      C: tool_choice any for every request in the pipeline.
      D: Put classify_document first in the tools array.
    answer: B
    why:
      A: auto permits the model to skip the classifier.
      B: A forced named tool guarantees the mandatory first step, after which auto is appropriate.
      C: any guarantees some tool, not the right one.
      D: Array position does not constrain the call.
  - id: q-2.4-b
    task: "2.4"
    level: 1
    scenario: Developer Productivity
    stem: >-
      Which MCP configuration file is intended to be shared with the team
      through version control?
    options:
      A: The user-level MCP config in the home directory.
      B: A .env file alongside the project.
      C: The project .mcp.json file.
      D: The local settings file ignored by git.
    answer: C
    why:
      A: User-level configuration is personal to one machine.
      B: Environment files hold secrets and are not committed.
      C: Project .mcp.json is the shared, versioned place for server definitions.
      D: An ignored local file is by definition not shared.
  - id: q-2.4-c
    task: "2.4"
    level: 2
    scenario: Developer Productivity
    stem: >-
      A shared .mcp.json needs an API token for one server. How should it be
      written?
    options:
      A: Paste the token and restrict repository access to the team.
      B: Keep the token in a comment so tooling ignores it.
      C: Base64-encode the token before committing it.
      D: Reference the value through environment variable expansion so the committed file holds no secret.
    answer: D
    why:
      A: A committed token is a committed token, whatever the repository permissions.
      B: Comments are stored in the file exactly like values.
      C: Encoding is not encryption and is trivially reversed.
      D: Expansion keeps the config shareable and the secret out of git.
  - id: q-2.4-d
    task: "2.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      An agent makes six exploratory calls each session just to learn what
      product categories exist before it can query anything useful. What removes
      that overhead?
    options:
      A: Expose the catalog as an MCP resource the agent can read directly.
      B: Cache the category list in the agent's system prompt and update it manually.
      C: Give the agent a larger context window so the exploration costs less.
      D: Increase the per-call result limit so fewer calls are needed.
    answer: A
    why:
      A: Resources are for reference data, which is exactly what removes exploratory calls.
      B: A hand-maintained prompt copy goes stale and must be edited on every change.
      C: A bigger window pays for the exploration instead of avoiding it.
      D: Fewer, larger calls are still exploratory calls.
  - id: q-2.4-e
    task: "2.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A team is about to build a custom MCP server to read GitHub issues. What
      should be checked first?
    options:
      A: Whether the team has capacity to maintain a server long term.
      B: Whether a maintained community server already covers it, since custom servers are for team-specific workflows.
      C: Whether the server can be written in the same language as the main app.
      D: Whether the server can be committed to the same repository.
    answer: B
    why:
      A: Capacity matters, but the first question is whether the work is needed at all.
      B: Preferring community servers and building only for team-specific workflows is the rule.
      C: Language choice is irrelevant to whether the server should exist.
      D: Repository layout is a detail, not a build-or-reuse decision.
  - id: q-2.5-b
    task: "2.5"
    level: 1
    scenario: Developer Productivity
    stem: >-
      Which built-in tool searches inside file contents rather than matching
      file paths?
    options:
      A: Glob
      B: Read
      C: Grep
      D: Edit
    answer: C
    why:
      A: Glob matches paths by pattern.
      B: Read returns one file you already know about.
      C: Grep searches contents.
      D: Edit modifies a file.
  - id: q-2.5-c
    task: "2.5"
    level: 2
    scenario: Developer Productivity
    stem: >-
      You need every call site of a function named applyDiscount across an
      unfamiliar repository. What is the right first move?
    options:
      A: Glob for files likely to use it, then read each one.
      B: Edit the function to add a log line and run the test suite.
      C: Read the whole codebase so nothing is missed.
      D: Grep for applyDiscount, then Read the files that matched to follow the imports.
    answer: D
    why:
      A: Glob matches paths, so it cannot find callers by name.
      B: Instrumenting and running tests finds only covered call sites.
      C: Reading everything up front is the trap this task names.
      D: Grep locates occurrences and Read follows only what matched.
  - id: q-2.5-d
    task: "2.5"
    level: 3
    scenario: Developer Productivity
    stem: >-
      An Edit fails because its anchor text appears four times in the file. What
      is the correct response?
    options:
      A: Widen the anchor with surrounding lines so it is unique, and fall back to Read plus Write if no unique anchor exists.
      B: Retry the same Edit until it happens to apply.
      C: Delete the file and write it again from memory.
      D: Apply the edit four times so every occurrence is covered.
    answer: A
    why:
      A: Edit needs a unique anchor; Read plus Write is the documented fallback.
      B: A non-unique anchor fails deterministically, so retrying changes nothing.
      C: Rewriting from memory risks losing content that was never read.
      D: That changes three places that were not meant to change.
  - id: q-2.5-e
    task: "2.5"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A reviewer insists the agent read all 300 files before starting, to avoid
      missing context. Why is this the wrong default?
    options:
      A: Reading files is slower than searching them.
      B: It spends the context budget on files that are irrelevant to the change, diluting attention and crowding out the files that matter.
      C: Read can only open one file per session.
      D: The agent cannot search a file it has already read.
    answer: B
    why:
      A: Speed is a secondary concern next to what fills the context.
      B: Targeted discovery keeps the context on the code that is actually involved.
      C: Read has no such limit.
      D: Reading does not prevent searching.

