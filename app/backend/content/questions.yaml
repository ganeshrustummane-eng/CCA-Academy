  - id: q-4.1-b
    task: "4.1"
    level: 1
    scenario: Code Generation
    stem: >-
      Which instruction gives a review agent usable criteria?
    options:
      A: Be conservative and only report things that really matter.
      B: Use your best judgement about severity.
      C: Report unhandled promise rejections and missing input validation on request handlers; skip formatting and naming.
      D: Report anything a senior engineer would comment on.
    answer: C
    why:
      A: Conservative is a disposition, not a criterion anyone can apply twice the same way.
      B: Judgement without criteria is the problem being solved.
      C: Naming what to report and what to skip is what makes output consistent.
      D: It defers the definition to an imagined person.
  - id: q-4.1-c
    task: "4.1"
    level: 2
    scenario: Code Generation
    stem: >-
      One finding category produces so many false positives that developers now
      ignore all categories. What is the immediate move?
    options:
      A: Add a confidence threshold so only high-confidence findings in that category surface.
      B: Lower the severity of that category so it sorts to the bottom.
      C: Keep it enabled and add a note explaining that the category is noisy.
      D: Disable that category while its criteria are rewritten, so the remaining categories regain trust.
    answer: D
    why:
      A: A threshold suppresses volume without fixing the criteria that misfire.
      B: Reordering still leaves the wrong findings in the report.
      C: A disclaimer does not stop the noise being read first.
      D: False positives in one category destroy trust in all of them, so it comes out until it is fixed.
  - id: q-4.1-d
    task: "4.1"
    level: 3
    scenario: Code Generation
    stem: >-
      A severity scale defines high, medium and low in words only, and two
      reviewers grade the same issue differently. What closes the gap?
    options:
      A: Give a short code example of a typical issue at each severity, so the boundary is shown rather than described.
      B: Reduce the scale to two levels so there is less room to disagree.
      C: Add a tie-break rule that the higher severity wins.
      D: Have a third reviewer arbitrate disagreements.
    answer: A
    why:
      A: Examples per severity anchor the boundary where prose cannot.
      B: Fewer buckets move the ambiguity rather than removing it.
      C: Always rounding up inflates severity and still does not define it.
      D: Arbitration handles each case again instead of fixing the definition.
  - id: q-4.1-e
    task: "4.1"
    level: 3
    scenario: Code Generation
    stem: >-
      A director asks why a confidence threshold is not the right first answer
      to a false-positive problem. What is the reasoning?
    options:
      A: Confidence scores are expensive to compute on every finding.
      B: Self-reported confidence does not reliably track correctness, so thresholding hides both wrong findings and right ones without improving the criteria.
      C: Thresholds cannot be applied per category.
      D: Developers cannot see the threshold, so they distrust it.
    answer: B
    why:
      A: Cost is not the objection.
      B: The criteria are what misfire; a threshold only changes how much of the misfire is shown.
      C: Per-category thresholds are perfectly possible.
      D: Visibility is a presentation concern, not the defect.
  - id: q-4.2-b
    task: "4.2"
    level: 1
    scenario: Structured Extraction
    stem: >-
      How many few-shot examples are usually appropriate for teaching a
      judgement call?
    options:
      A: One, so the model is not over-constrained.
      B: As many as the context window allows.
      C: Two to four targeted examples of genuinely ambiguous cases.
      D: None, because instructions are more reliable than examples.
    answer: C
    why:
      A: One example reads as a special case rather than a pattern.
      B: Volume dilutes attention and buys little past the first few.
      C: A small number of well-chosen ambiguous cases is what shifts judgement.
      D: Instructions are what fail when the problem is judgement.
  - id: q-4.2-c
    task: "4.2"
    level: 2
    scenario: Structured Extraction
    stem: >-
      What should accompany each few-shot example so it teaches rather than just
      demonstrates?
    options:
      A: The confidence score the model should assign.
      B: The name of the reviewer who approved the example.
      C: A count of how often this case appears in production.
      D: The reasoning for why that action was chosen for that input.
    answer: D
    why:
      A: A score without the reasoning is another unexplained output.
      B: Provenance is audit metadata, not instruction.
      C: Frequency is useful for prioritising examples, not for applying them.
      D: The reasoning is what generalises to cases not in the examples.
  - id: q-4.2-d
    task: "4.2"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Extraction returns empty fields for invoices from three vendors whose
      layouts differ from the examples given. What is the fix?
    options:
      A: Add examples covering the varied document structures, so the pattern is taught across layouts rather than one.
      B: Add more instructions describing where fields usually appear.
      C: Lower the temperature so output is more consistent.
      D: Mark the fields as required so they cannot come back empty.
    answer: A
    why:
      A: Structural variety in the examples is what stops layout-specific failure.
      B: More prose about typical layouts does not cover the atypical ones.
      C: Consistency does not help if the model cannot locate the field.
      D: Forcing a value invites a fabricated one.
  - id: q-4.2-e
    task: "4.2"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Output is already correctly formatted but the model keeps classifying
      borderline cases inconsistently. Adding a fifth paragraph of instructions
      changed nothing. Why?
    options:
      A: The instructions exceeded the length the model attends to.
      B: The problem is inconsistent judgement on ambiguous input, which examples address and more instructions do not.
      C: The schema is missing an enum for the borderline class.
      D: The temperature is too high for classification work.
    answer: B
    why:
      A: Length is not what makes the instruction ineffective here.
      B: Instructions describe the rule; examples demonstrate where the line falls.
      C: A missing enum would produce invalid values, not inconsistent ones.
      D: Temperature adds variance but does not define the boundary.
  - id: q-4.3-b
    task: "4.3"
    level: 1
    scenario: Structured Extraction
    stem: >-
      What does a JSON schema on a tool_use call guarantee?
    options:
      A: That the extracted values are factually correct.
      B: That no field will be left empty.
      C: That the output is syntactically valid and matches the declared shape.
      D: That the model read the whole document.
    answer: C
    why:
      A: Semantics are not enforced by a shape constraint.
      B: Nullable and optional fields may legitimately be empty.
      C: Schemas remove syntax and shape errors, which is their whole job.
      D: The schema says nothing about what was read.
  - id: q-4.3-c
    task: "4.3"
    level: 2
    scenario: Structured Extraction
    stem: >-
      A purchase order number is genuinely absent from some documents, yet the
      model invents plausible ones. What schema change helps?
    options:
      A: Make the field required with a pattern constraint.
      B: Add a second field for the model's confidence in the number.
      C: Add a description telling the model not to guess.
      D: Make the field nullable, so absent is an expressible answer.
    answer: D
    why:
      A: Requiring it forces the model to produce something, which is the fabrication.
      B: A confidence score does not stop the invented value being returned.
      C: A description competes with a schema that demands a value.
      D: Fabrication happens when the schema has no way to say not present.
  - id: q-4.3-d
    task: "4.3"
    level: 3
    scenario: Structured Extraction
    stem: >-
      A document type enum covers six known types, and the seventh kind of
      document arrives. What design avoids silent misclassification?
    options:
      A: Include an unclear or other member plus a free-text detail field, so unknown input is reported rather than forced into a known bucket.
      B: Expand the enum whenever a new type appears in production.
      C: Remove the enum and accept any string.
      D: Reject documents that do not match a known type.
    answer: A
    why:
      A: An explicit escape hatch with detail turns an unknown into a signal instead of a wrong label.
      B: Reacting after each surprise means every new type is misclassified once.
      C: A free string loses the validation the enum provides for known types.
      D: Rejecting loses documents the business still needs processed.
  - id: q-4.3-e
    task: "4.3"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Schema validation passes on 100 percent of extractions, and the team
      reports the pipeline as reliable. What is wrong with that claim?
    options:
      A: Nothing, provided the schema covers every field.
      B: Validation proves the shape is right, not the values; a well-formed wrong total still validates.
      C: Validation rates are only meaningful above a sample size of 1000.
      D: Validation is performed client side and can be bypassed.
    answer: B
    why:
      A: Field coverage still says nothing about correctness of values.
      B: Syntactic success is routinely mistaken for semantic success, and they are different claims.
      C: Sample size is not what makes the claim wrong.
      D: Where validation runs does not change what it measures.
  - id: q-4.4-b
    task: "4.4"
    level: 1
    scenario: Structured Extraction
    stem: >-
      What should a validation-retry request include?
    options:
      A: Only the original document, so the model starts clean.
      B: Only the failed output, to save tokens.
      C: The document, the output that failed and the specific validation error.
      D: The document and an instruction to try harder.
    answer: C
    why:
      A: Starting clean discards the information about what went wrong.
      B: Without the document the model cannot re-derive the right value.
      C: The specific error is what turns a retry into a correction.
      D: Try harder gives the model nothing actionable.
  - id: q-4.4-c
    task: "4.4"
    level: 2
    scenario: Structured Extraction
    stem: >-
      A required tax identifier is simply not printed on the invoice. The retry
      loop runs three times and then fails. What is the real problem?
    options:
      A: The retry limit is too low for this document type.
      B: The schema should mark the field as a string rather than a pattern.
      C: The validation error message is not specific enough.
      D: Retries fix format problems, not missing source data, so this should be reported as absent rather than retried.
    answer: D
    why:
      A: No number of retries can produce information the document does not contain.
      B: The type is not what makes the value unobtainable.
      C: A clearer message does not conjure the identifier.
      D: Retrying for absent data is the trap; the correct output is an explicit absence.
  - id: q-4.4-d
    task: "4.4"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Invoices occasionally carry a stated total that does not equal the sum of
      line items. How should the schema surface this?
    options:
      A: Extract calculated_total alongside stated_total so a discrepancy is visible in the data rather than inferred later.
      B: Return the stated total and log a warning when it looks wrong.
      C: Return whichever total is larger, as the safer figure.
      D: Reject the document for manual entry.
    answer: A
    why:
      A: Capturing both values makes the discrepancy a first-class, queryable fact.
      B: A log line is not part of the record downstream systems read.
      C: Picking a number silently resolves a conflict that a human should see.
      D: Rejecting every arithmetic mismatch sends routine documents to manual work.
  - id: q-4.4-e
    task: "4.4"
    level: 3
    scenario: Code Generation
    stem: >-
      A review pipeline dismisses many findings, and the team wants to learn
      from them rather than only count them. What field helps?
    options:
      A: A free-text note from whoever dismissed the finding.
      B: A detected_pattern field on each finding, so dismissed findings can be grouped and the criteria that generated them revised.
      C: A timestamp, so dismissal rates can be tracked over time.
      D: A severity override, so dismissed findings are downgraded automatically.
    answer: B
    why:
      A: Free text does not aggregate into a pattern anyone can act on.
      B: Naming the pattern is what makes a pile of dismissals into a criteria fix.
      C: A rate shows that something is wrong without showing what.
      D: Automatic downgrading hides the category instead of correcting it.
  - id: q-4.5-b
    task: "4.5"
    level: 1
    scenario: Structured Extraction
    stem: >-
      Which is a documented property of the Batch API?
    options:
      A: It guarantees completion within five minutes.
      B: It supports multi-turn tool calling.
      C: It costs roughly half as much, with results returned within 24 hours and no latency guarantee.
      D: It returns results in submission order without any correlation identifier.
    answer: C
    why:
      A: There is no latency SLA, which is the trade being made.
      B: Multi-turn tool calling is not available in batch.
      C: Half cost, up to 24 hours and no latency guarantee is the shape of the deal.
      D: Results are correlated by custom_id rather than by order.
  - id: q-4.5-c
    task: "4.5"
    level: 2
    scenario: Structured Extraction
    stem: >-
      A batch of 5000 documents returns with 180 failures. What should be
      resubmitted?
    options:
      A: The whole batch, so the run is consistent.
      B: Nothing, until the prompt has been rewritten.
      C: The 180 failures plus a random sample of successes as a control.
      D: Only the 180 failures, matched back by their custom_id.
    answer: D
    why:
      A: Re-running 4820 successful documents pays twice for work already done.
      B: A rewrite may be warranted, but the failures still need processing.
      C: A control sample is for prompt tuning, not for recovering failures.
      D: custom_id exists precisely so failures can be identified and resubmitted alone.
  - id: q-4.5-d
    task: "4.5"
    level: 3
    scenario: CI/CD
    stem: >-
      Someone proposes moving the pre-merge review job to the Batch API to halve
      its cost. Assess this.
    options:
      A: Wrong — a pre-merge gate blocks a developer, and a job with no latency guarantee could hold the merge for hours.
      B: Sound — review findings are not time-critical.
      C: Sound, provided the batch is submitted when the branch is created.
      D: Wrong — batch cannot process source code.
    answer: A
    why:
      A: Blocking work needs synchronous calls; batch suits overnight and weekly jobs.
      B: A blocked merge is time-critical by definition.
      C: Early submission cannot cover commits made after it was submitted.
      D: Batch has no such content restriction.
  - id: q-4.5-e
    task: "4.5"
    level: 3
    scenario: Structured Extraction
    stem: >-
      A 40000-document overnight extraction is about to be submitted for the
      first time. What should happen before it is?
    options:
      A: Split it into four batches so partial failure is cheaper.
      B: Tune the prompt on a small representative sample, so a systematic flaw is not multiplied by 40000.
      C: Raise the retry limit so transient failures are absorbed.
      D: Submit it twice and compare, to measure variance.
    answer: B
    why:
      A: Splitting limits blast radius without catching the flaw first.
      B: A sample run is the cheap place to discover a systematic prompt problem.
      C: Retries do not help when every document is processed wrongly.
      D: Paying twice to measure variance costs more than sampling.
  - id: q-4.6-b
    task: "4.6"
    level: 1
    scenario: Code Generation
    stem: >-
      Why does an independent instance catch more than self-review?
    options:
      A: It is given a longer context window.
      B: It uses a newer model version.
      C: It does not share the assumptions that produced the code, so blind spots are not inherited.
      D: It reviews more slowly and therefore more carefully.
    answer: C
    why:
      A: Window size is not what creates independence.
      B: A different version may help, but the mechanism is fresh context.
      C: Independence of assumptions is exactly what makes the second look valuable.
      D: Speed is not the differentiator.
  - id: q-4.6-c
    task: "4.6"
    level: 2
    scenario: Code Generation
    stem: >-
      Per-file review passes are in place. What does adding an integration pass
      buy?
    options:
      A: A second opinion on each file, raising confidence per file.
      B: Consistent severity grading across files.
      C: A shorter total runtime, because the integration pass replaces some file passes.
      D: Coverage of defects that live between files, such as a contract mismatch across a module boundary.
    answer: D
    why:
      A: A repeat per-file pass is not what an integration pass does.
      B: Grading consistency comes from criteria, not from a further pass.
      C: It adds work rather than replacing it.
      D: Cross-file data flow is invisible to any single-file pass.
  - id: q-4.6-d
    task: "4.6"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Reviewer capacity covers about 8 percent of output. How should findings be
      routed to them?
    options:
      A: By confidence, sending the lowest-confidence findings to humans, with thresholds calibrated on labelled data.
      B: Randomly, so the sample stays unbiased.
      C: By severity alone, sending every high-severity finding.
      D: By age, oldest first, so nothing waits indefinitely.
    answer: A
    why:
      A: Scarce review is worth most where the model is least sure, and the threshold must be calibrated rather than guessed.
      B: A random sample measures quality but wastes scarce capacity on easy cases.
      C: A confident high-severity finding may need less human time than an uncertain one.
      D: Queue age is a fairness rule, not a value-of-review rule.
  - id: q-4.6-e
    task: "4.6"
    level: 3
    scenario: Structured Extraction
    stem: >-
      A confidence threshold of 0.8 was chosen because it felt reasonable, and
      the human queue is now full of findings that turn out correct. What is the
      principled fix?
    options:
      A: Raise the threshold to 0.9 and observe the queue next month.
      B: Calibrate the threshold against a labelled set, so the cut point is chosen from measured accuracy at each confidence level.
      C: Remove the threshold and route by severity instead.
      D: Have the model re-score its own low-confidence findings.
    answer: B
    why:
      A: A second guess is still a guess, and costs another month.
      B: Calibration on labelled data is what turns a felt number into a defensible one.
      C: Severity answers a different question from how sure the model is.
      D: Self-rescoring reuses the signal that is already miscalibrated.

# ---------------------------------------------------------------------------
# D5 Context Management & Reliability
# ---------------------------------------------------------------------------
  - id: q-5.1-b
    task: "5.1"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      Which part of a long conversation should never be summarised away?
    options:
      A: The agent's earlier explanations to the customer.
      B: The raw tool results from the first few turns.
      C: The case-facts block holding amounts, dates and identifiers.
      D: The system prompt's tone guidance.
    answer: C
    why:
      A: Explanations can be summarised without losing the case.
      B: Raw tool results are the first thing worth trimming.
      C: Exact amounts, dates and IDs are the facts every later decision depends on.
      D: Tone guidance lives in the system prompt and is resent each turn.
  - id: q-5.1-c
    task: "5.1"
    level: 2
    scenario: Customer Support Agent
    stem: >-
      After progressive summarisation, a refund amount of $247.83 has become a
      recent order in the agent's context. What is the consequence and the fix?
    options:
      A: Only readability suffers, so nothing needs changing.
      B: Raise the context limit so summarisation never triggers.
      C: The agent should re-ask the customer for the amount each turn.
      D: The agent can no longer act on the amount; keep a verbatim case-facts block outside the summarisable region.
    answer: D
    why:
      A: A lost figure is a lost decision input, not a cosmetic issue.
      B: A bigger window delays the problem rather than removing it.
      C: Re-asking the customer for facts the system had is poor service.
      D: Precise values must be pinned verbatim rather than left in the summarised region.
  - id: q-5.1-d
    task: "5.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      A long transcript's critical constraint sits in the middle of the context
      and is reliably ignored. What follows from this?
    options:
      A: Key findings and constraints belong near the start or end, because recall degrades for material in the middle of a long input.
      B: The constraint should be repeated at every turn.
      C: The context should be split across two parallel requests.
      D: The constraint should be moved into a tool description.
    answer: A
    why:
      A: Position matters, so important material is placed where recall is strongest.
      B: Repetition at every turn inflates cost and still competes with surrounding bulk.
      C: Splitting the request leaves each half without the other's context.
      D: A tool description is read when selecting that tool, not as a standing constraint.
  - id: q-5.1-e
    task: "5.1"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      Tool results average 4 KB each and twelve accumulate per conversation.
      What is the right handling?
    options:
      A: Drop the oldest results once the context fills.
      B: Trim each result to the fields the agent actually uses before appending it.
      C: Summarise all twelve into one paragraph after every turn.
      D: Store the results externally and reference them by identifier.
    answer: B
    why:
      A: Dropping by age discards results that may still be needed.
      B: Trimming at the point of appending keeps what matters and never admits the bulk.
      C: Repeated summarisation is what loses precise values.
      D: An identifier the model cannot dereference is the same as not having the data.
  - id: q-5.2-b
    task: "5.2"
    level: 1
    scenario: Customer Support Agent
    stem: >-
      Which signal should trigger escalation immediately?
    options:
      A: A negative sentiment score on the customer's last message.
      B: The model reporting low confidence in its answer.
      C: The customer explicitly asking to speak to a human.
      D: The conversation exceeding ten turns.
    answer: C
    why:
      A: Sentiment is an unreliable proxy for wanting a human.
      B: Self-reported confidence is not a dependable trigger.
      C: An explicit request for a human is honoured immediately.
      D: Length alone says nothing about whether progress is being made.
  - id: q-5.2-c
    task: "5.2"
    level: 2
    scenario: Customer Support Agent
    stem: >-
      A customer lookup by surname returns three matching accounts. What should
      the agent do?
    options:
      A: Use the most recently active account, since it is the likeliest match.
      B: Act on all three accounts and report the combined result.
      C: Escalate to a human immediately.
      D: Ask the customer for a distinguishing identifier such as an order number or email.
    answer: D
    why:
      A: Guessing the most recent account is the trap, and it can act on a stranger's order.
      B: Touching three accounts to serve one is a privacy incident.
      C: Escalation is premature when one question would resolve it.
      D: Asking for an identifier is cheap and resolves the ambiguity correctly.
  - id: q-5.2-d
    task: "5.2"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      A request falls outside every documented policy. The agent constructs a
      reasonable-sounding answer. What should have happened?
    options:
      A: A policy gap is an escalation trigger, because inventing policy commits the business to something nobody approved.
      B: The answer is acceptable if it is consistent with the policy's spirit.
      C: The agent should decline and end the conversation.
      D: The agent should ask the customer what the policy should be.
    answer: A
    why:
      A: Policy gaps escalate to someone with authority to decide.
      B: Reasoning from spirit is how unapproved commitments get made.
      C: Declining abandons a customer with a legitimate need.
      D: The customer is not the authority on company policy.
  - id: q-5.2-e
    task: "5.2"
    level: 3
    scenario: Customer Support Agent
    stem: >-
      A team wants escalation driven by a sentiment model, arguing that upset
      customers should reach a human sooner. What is the objection?
    options:
      A: Sentiment models are too slow to run per message.
      B: Sentiment measures tone rather than whether the agent can resolve the case, so it escalates calm unsolvable cases late and angry solvable ones early.
      C: Sentiment scores cannot be logged for audit.
      D: Customers would learn to write angrily to reach a human.
    answer: B
    why:
      A: Latency is not the substantive objection.
      B: The trigger should track resolvability — explicit request, policy gap or stalled progress — not mood.
      C: Scores are perfectly loggable.
      D: A real concern, but secondary to the trigger measuring the wrong thing.
  - id: q-5.3-b
    task: "5.3"
    level: 1
    scenario: Multi-Agent Research
    stem: >-
      What distinguishes an access failure from a valid empty result?
    options:
      A: Nothing meaningful — both mean no data was returned.
      B: An access failure always returns an HTTP status, an empty result never does.
      C: An access failure means the question was not answered and may be retryable; an empty result is the answer.
      D: An empty result is always a bug in the tool.
    answer: C
    why:
      A: Conflating them is exactly what causes pointless retries and false escalations.
      B: Status codes are an implementation detail, not the distinction.
      C: One is an unanswered question, the other is an answer of none.
      D: Empty results are routine and legitimate.
  - id: q-5.3-c
    task: "5.3"
    level: 2
    scenario: Multi-Agent Research
    stem: >-
      One of five parallel subagents fails. The orchestrator aborts the whole
      workflow. What is wrong with that?
    options:
      A: Nothing — partial results cannot be trusted.
      B: The orchestrator should substitute a cached result for the failed subagent.
      C: The orchestrator should retry the whole workflow from the start.
      D: Four subagents' work is discarded for one failure; the right behaviour is to keep the partial results and annotate the coverage gap.
    answer: D
    why:
      A: Partial results are trustworthy as long as the gap is explicit.
      B: Silently filling a gap with stale data is worse than reporting it.
      C: Restarting repeats four successful runs.
      D: Keeping what succeeded and naming what did not is both cheaper and more honest.
  - id: q-5.3-d
    task: "5.3"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      What should a propagated error carry so the receiving layer can act on it?
    options:
      A: The error type, the query that was attempted, any partial results and the alternatives already tried.
      B: The stack trace, so the cause is fully visible.
      C: A retry count and a timestamp.
      D: A severity level assigned by the failing subagent.
    answer: A
    why:
      A: Type, attempt, partial results and alternatives are what let the caller decide the next move.
      B: A stack trace helps an engineer later; it does not tell the caller what to do now.
      C: Counters describe the failure without describing the state.
      D: A severity label is a judgement without the evidence behind it.
  - id: q-5.3-e
    task: "5.3"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A subagent swallows a failed region and returns only the regions that
      worked. The final report reads as complete. What is the harm?
    options:
      A: Only efficiency, since the missing region can be requested later.
      B: The report makes a claim of coverage it cannot support, and nobody downstream can tell that a region is missing.
      C: The coordinator will retry the subagent unnecessarily.
      D: Token cost rises because the region is fetched twice.
    answer: B
    why:
      A: The problem is a false claim, not a scheduling inefficiency.
      B: Silent suppression converts a known gap into an invisible one, which is the worst of the options.
      C: Nothing signals the coordinator to retry at all.
      D: Cost is unaffected; the call never succeeded.
  - id: q-5.4-b
    task: "5.4"
    level: 1
    scenario: Developer Productivity
    stem: >-
      What happens to agent output as a single exploration session grows very
      long?
    options:
      A: It becomes more accurate as more of the codebase is in context.
      B: It stops calling tools and answers only from memory.
      C: It drifts toward generic patterns and away from this codebase's specifics.
      D: It refuses further requests until the session is compacted.
    answer: C
    why:
      A: More material in context does not mean better recall of any of it.
      B: Tool use continues; it is the specificity that decays.
      C: Long sessions drift toward generic advice, which is the signal to externalise state.
      D: There is no such automatic refusal.
  - id: q-5.4-c
    task: "5.4"
    level: 2
    scenario: Developer Productivity
    stem: >-
      An exploration has produced useful findings across forty files, and the
      context is nearly full. What preserves the findings best?
    options:
      A: Compact the session and continue, trusting the compaction summary.
      B: Increase the output token limit.
      C: Keep going and rely on the findings being recalled when needed.
      D: Write the findings to a scratchpad file, then continue or restart from it.
    answer: D
    why:
      A: Compaction is lossy in ways you do not choose.
      B: Output limits have nothing to do with retaining findings.
      C: Relying on recall in a full context is where drift begins.
      D: A scratchpad outside the session is durable and reloadable, and you decide what it keeps.
  - id: q-5.4-d
    task: "5.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A review of a large codebase needs the main session to stay focused on
      decisions rather than file excerpts. What structure achieves that?
    options:
      A: Delegate discovery to subagents that return conclusions, keeping excerpts out of the main context.
      B: Read every file in the main session, then delete the excerpts.
      C: Compact the main session after each file.
      D: Lower the main session's temperature to keep it on task.
    answer: A
    why:
      A: Isolating discovery is what keeps the decision context clean.
      B: You cannot remove what has already shaped the context.
      C: Repeated compaction loses detail unpredictably.
      D: Temperature does not control what occupies the context.
  - id: q-5.4-e
    task: "5.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A six-hour migration run dies at hour five. What should have been in place
      so the work was not lost?
    options:
      A: A longer timeout on the run.
      B: An exported manifest of completed work, written as the run progressed, so a new run resumes from it.
      C: A larger context window.
      D: A retry wrapper around the whole run.
    answer: B
    why:
      A: A timeout does not survive a crash.
      B: Durable progress written outside the session is what makes a run resumable.
      C: Window size does not persist anything.
      D: Retrying the whole run repeats five hours of completed work.
  - id: q-5.5-b
    task: "5.5"
    level: 1
    scenario: Structured Extraction
    stem: >-
      Why is a single aggregate accuracy figure an insufficient quality measure?
    options:
      A: It is usually computed on too small a sample.
      B: It cannot be compared between months.
      C: It can hide a document type or field that performs far worse than the average.
      D: It excludes documents that failed validation.
    answer: C
    why:
      A: Sample size is a separate concern from aggregation.
      B: Comparability is not the structural flaw.
      C: Averages conceal weak segments, which is why validation is sliced by type and field.
      D: What is excluded depends on the pipeline, not on aggregation itself.
  - id: q-5.5-c
    task: "5.5"
    level: 2
    scenario: Structured Extraction
    stem: >-
      Overall accuracy is 97 percent, yet finance keeps finding wrong tax
      amounts. What should be measured?
    options:
      A: A larger overall sample, to tighten the confidence interval.
      B: The rate at which finance reports problems.
      C: The model's average confidence on tax fields.
      D: Accuracy broken down per document type and per field, so the tax field's own rate is visible.
    answer: D
    why:
      A: A bigger sample of the same average still hides the segment.
      B: Complaint volume is a lagging proxy for the thing you can measure directly.
      C: Confidence is the model's opinion, not measured accuracy.
      D: Per-type and per-field breakdowns are what expose a weak field inside a good average.
  - id: q-5.5-d
    task: "5.5"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Human reviewers only ever see low-confidence output, and the measured
      accuracy of high-confidence output is unknown. What should change?
    options:
      A: Sample a small share of high-confidence output too, because otherwise a confidently wrong segment is undetectable.
      B: Nothing — reviewing confident output wastes scarce capacity.
      C: Route all output to review until the backlog clears.
      D: Have the model re-score its high-confidence findings.
    answer: A
    why:
      A: A small audit sample is what keeps the confidence signal honest.
      B: Never checking the confident path is how a silent regression survives.
      C: Reviewing everything abandons the triage that makes the queue viable.
      D: Re-scoring reuses the signal whose calibration is in question.
  - id: q-5.5-e
    task: "5.5"
    level: 3
    scenario: Structured Extraction
    stem: >-
      Confidence is currently reported once per document. Reviewers say it is
      not actionable. What is the improvement?
    options:
      A: Report it as a letter grade rather than a number.
      B: Report confidence per field, so review time goes to the specific values that are uncertain.
      C: Report the average confidence across the batch.
      D: Hide confidence from reviewers so it does not bias them.
    answer: B
    why:
      A: Relabelling the same number changes nothing about what to check.
      B: Per-field confidence tells a reviewer exactly which value to look at.
      C: A batch average is further from the decision, not closer.
      D: Removing the signal leaves reviewers with no way to triage at all.
  - id: q-5.6-b
    task: "5.6"
    level: 1
    scenario: Multi-Agent Research
    stem: >-
      What should a claim-source mapping record?
    options:
      A: The claim and the name of the agent that found it.
      B: The claim and a confidence score.
      C: The claim, its source URL or document, the supporting excerpt and the date.
      D: The claim and the number of sources that agreed.
    answer: C
    why:
      A: Which agent found it does not let a reader verify it.
      B: A score is an assertion, not evidence.
      C: Source, excerpt and date are what make a claim checkable.
      D: Agreement counts without sources cannot be audited.
  - id: q-5.6-c
    task: "5.6"
    level: 2
    scenario: Multi-Agent Research
    stem: >-
      Two sources give market size as $4.2bn and $6.8bn. What belongs in the
      report?
    options:
      A: The higher figure, with the lower one dropped as an outlier.
      B: Neither, until a third source breaks the tie.
      C: The average of the two.
      D: Both figures with their sources and dates, since differing dates or definitions usually explain the gap.
    answer: D
    why:
      A: Choosing arbitrarily hides a disagreement the reader needs to see.
      B: Withholding both loses information that is already useful when attributed.
      C: Averaging two incompatible definitions produces a number nobody published.
      D: Attribution plus dates lets the reader judge, and often explains the discrepancy outright.
  - id: q-5.6-d
    task: "5.6"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      Why does provenance require dates and not just sources?
    options:
      A: Because two sources often disagree only because they describe different periods, and the date is what makes that visible.
      B: Because readers prefer recent citations.
      C: Because undated sources cannot be linked.
      D: Because dates are needed to order the bibliography.
    answer: A
    why:
      A: Dates frequently resolve an apparent conflict into two consistent facts.
      B: Preference is not the mechanism.
      C: Undated sources are still linkable.
      D: Ordering is presentation, not provenance.
  - id: q-5.6-e
    task: "5.6"
    level: 3
    scenario: Multi-Agent Research
    stem: >-
      A synthesis step renders quarterly financials as flowing prose and
      competitor news as a dense table. Reviewers struggle with both. What is the
      principle being missed?
    options:
      A: Reports should use one consistent format throughout.
      B: Render by content type — comparable numeric series as tables, narrative developments as prose.
      C: All content should be tabular, because tables are denser.
      D: Formatting should match whatever the source used.
    answer: B
    why:
      A: Consistency for its own sake is what produced both mismatches.
      B: The format should follow the structure of the content it carries.
      C: Tables flatten narrative into cells that lose the causal thread.
      D: Source formatting reflects the source's purpose, not the report's.
