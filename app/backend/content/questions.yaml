  - id: q-3.1-b
    task: "3.1"
    level: 1
    scenario: Developer Productivity
    stem: >-
      Which CLAUDE.md location is shared with the whole team through the
      repository?
    options:
      A: The user-level file in the home directory.
      B: A file inside the local settings directory that git ignores.
      C: The project-level file at the repository root.
      D: The directory-level file, which applies only in its own folder.
    answer: C
    why:
      A: User-level config is personal to one machine.
      B: An ignored file reaches nobody else.
      C: The project-level file is committed and therefore shared.
      D: Directory-level config is shared but scoped to that folder, not the team standard.
  - id: q-3.1-c
    task: "3.1"
    level: 2
    scenario: Developer Productivity
    stem: >-
      A convention works perfectly for you and is ignored on every teammate's
      machine. Where should you look first?
    options:
      A: The repository history, to check whether someone reverted it.
      B: The permissions file, which may be blocking the tool.
      C: The MCP server list, which may be missing on their machines.
      D: Your user-level CLAUDE.md, because an instruction that only you have is usually personal config.
    answer: D
    why:
      A: A revert would have affected you too.
      B: A blocked tool fails loudly rather than silently ignoring a convention.
      C: MCP servers do not carry conventions.
      D: Working-for-me-only is the signature of an instruction in user-level config.
  - id: q-3.1-d
    task: "3.1"
    level: 2
    scenario: Developer Productivity
    stem: >-
      You want to confirm which instruction files are actually loaded in the
      current session. What do you use?
    options:
      A: The /memory command, which lists the loaded instruction files.
      B: Read each candidate CLAUDE.md and compare by hand.
      C: The settings file, which lists them in load order.
      D: Start a new session and watch which files are opened.
    answer: A
    why:
      A: /memory reports the loaded set directly.
      B: Reading files tells you what exists, not what is loaded.
      C: Settings configure behaviour and do not enumerate loaded memory files.
      D: Loading is not visible as file-open activity.
  - id: q-3.1-e
    task: "3.1"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A 400-line project CLAUDE.md mixes coding standards, release steps and
      three subsystem quirks. Every session pays for all of it. What is the
      right restructuring?
    options:
      A: Shorten each section until the file fits a budget.
      B: Keep the always-true standards in CLAUDE.md, move subsystem detail into path-scoped rules, and move procedures into skills so they load on demand.
      C: Split it into one CLAUDE.md per directory.
      D: Move the whole file to user-level config so only those who want it pay.
    answer: B
    why:
      A: Trimming loses content without changing what is always loaded.
      B: Always-on, path-scoped and on-demand are three different load behaviours, and each part belongs in the one that matches it.
      C: Per-directory files duplicate cross-cutting content and still load eagerly where they match.
      D: User-level config stops the team from sharing the standards at all.
  - id: q-3.2-b
    task: "3.2"
    level: 1
    scenario: Developer Productivity
    stem: >-
      What is the key behavioural difference between a skill and CLAUDE.md?
    options:
      A: Skills can call tools; CLAUDE.md cannot.
      B: Skills are personal; CLAUDE.md is shared.
      C: CLAUDE.md is always loaded, while a skill loads on demand when it is invoked or matched.
      D: CLAUDE.md supports arguments; skills do not.
    answer: C
    why:
      A: Both describe behaviour; neither executes tools by itself.
      B: Both exist at user and project level.
      C: Always-on versus on-demand is the distinction that decides where content belongs.
      D: Skills are the ones with an argument hint.
  - id: q-3.2-c
    task: "3.2"
    level: 2
    scenario: Developer Productivity
    stem: >-
      A six-step release procedure is used twice a month and currently sits in
      the project CLAUDE.md. What should happen to it?
    options:
      A: Leave it, since a shared procedure belongs in shared config.
      B: Move it into user-level config for whoever runs releases.
      C: Move it into a path-scoped rule keyed to the release directory.
      D: Move it into a project skill, so it loads only on the two days a month it is needed.
    answer: D
    why:
      A: An occasional procedure in always-on config taxes every unrelated session.
      B: User-level config stops the rest of the team from running it.
      C: A release is not triggered by editing a particular file.
      D: Task procedures are the canonical case for an on-demand skill.
  - id: q-3.2-d
    task: "3.2"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A skill runs a dependency audit that prints 900 lines of tool output, and
      the main conversation is left unusable afterwards. Which frontmatter
      setting addresses this?
    options:
      A: Context fork, so the verbose work happens in a separate context and only the result returns.
      B: An allowed-tools list restricting it to the audit command.
      C: An argument hint describing the package to audit.
      D: Moving the skill to user level so it is invoked less often.
    answer: A
    why:
      A: Forking the context keeps the noise out of the main conversation.
      B: Restricting tools limits what it can do, not how much output returns.
      C: An argument hint is documentation for the caller.
      D: Where it lives does not change what it prints.
  - id: q-3.2-e
    task: "3.2"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A team has a universal rule that all money values use integer minor units.
      Someone proposes shipping it as a skill. Assess this.
    options:
      A: Correct — skills are the project-scoped place for team standards.
      B: Wrong — a universal invariant must be always-on, so it belongs in CLAUDE.md; skills are for procedures invoked when needed.
      C: Correct, provided the skill declares allowed-tools.
      D: Wrong — it belongs in user-level config so each developer can opt in.
    answer: B
    why:
      A: Skills are project-scoped but on-demand, which is the wrong load behaviour here.
      B: A rule that must hold on every edit cannot depend on someone remembering to invoke it.
      C: Tool permissions do not change when the content loads.
      D: Opt-in defeats the purpose of a team invariant.
  - id: q-3.3-b
    task: "3.3"
    level: 1
    scenario: Developer Productivity
    stem: >-
      What determines when a file in the rules directory is loaded?
    options:
      A: Alphabetical order, until the context budget is reached.
      B: Whether the user invokes it by name.
      C: Its paths glob, which loads the rule when a matching file is edited.
      D: Its position in the settings file.
    answer: C
    why:
      A: Rules are not loaded by name order.
      B: Invoking by name is how skills work.
      C: A paths glob scopes the rule to the files it concerns.
      D: Settings do not order rule loading.
  - id: q-3.3-c
    task: "3.3"
    level: 2
    scenario: Developer Productivity
    stem: >-
      Test-file conventions need to apply to test files scattered across twenty
      directories. What is the cleanest mechanism?
    options:
      A: A CLAUDE.md in each of the twenty directories.
      B: A skill the author invokes before writing tests.
      C: The conventions in the project CLAUDE.md, always loaded.
      D: One rule file with a recursive glob matching the test filename pattern.
    answer: D
    why:
      A: Twenty copies of one convention is twenty places to update.
      B: An invoked skill is skipped exactly when someone forgets.
      C: Always-on loading makes every unrelated session pay for test conventions.
      D: A recursive glob matches the pattern wherever it appears, in one file.
  - id: q-3.3-d
    task: "3.3"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A rule is correctly globbed to the migrations directory but never seems to
      apply when the agent writes a migration. What should be checked?
    options:
      A: Whether the files being edited actually match the glob, since scoped rules load only on a match.
      B: Whether the rule file is listed in the project CLAUDE.md.
      C: Whether the rule exceeds the size at which rules are skipped.
      D: Whether the agent has permission to read the rules directory.
    answer: A
    why:
      A: A near-miss glob is the common cause of a scoped rule that never fires.
      B: Rules are discovered by their own glob, not by a CLAUDE.md listing.
      C: There is no such size-based skipping to check.
      D: A permission problem would fail visibly rather than silently.
  - id: q-3.3-e
    task: "3.3"
    level: 3
    scenario: Developer Productivity
    stem: >-
      Why is scoping rules by path a context decision rather than only an
      organisational one?
    options:
      A: Because narrower files are easier for humans to review.
      B: Because an always-loaded rule spends context on every session, while a scoped rule spends it only in sessions that touch the matching files.
      C: Because globs let several rules load at once.
      D: Because rules loaded later override earlier ones.
    answer: B
    why:
      A: Readability is a side benefit, not the mechanism.
      B: Scoped loading is how instruction weight is kept proportional to relevance.
      C: Loading several rules is possible but is not the reason to scope.
      D: Override order is not what scoping buys.
  - id: q-3.4-b
    task: "3.4"
    level: 1
    scenario: Developer Productivity
    stem: >-
      Which situation calls for plan mode rather than direct execution?
    options:
      A: Adding a missing null check in one function.
      B: Fixing a typo in a README.
      C: Migrating an authentication approach across 45 files.
      D: Renaming one local variable.
    answer: C
    why:
      A: A one-line guard does not need a design round.
      B: A typo has no design space.
      C: Large multi-file architectural work is what planning is for.
      D: A local rename is a clear, contained change.
  - id: q-3.4-c
    task: "3.4"
    level: 2
    scenario: Developer Productivity
    stem: >-
      Discovery for a refactor requires grepping and skimming forty files, and
      that noise would crowd out the design work. What helps?
    options:
      A: Raise the context limit and read everything in the main session.
      B: Skip discovery and plan from the file names.
      C: Compact the session after reading each file.
      D: Send discovery to an Explore subagent, so only its conclusions return to the planning context.
    answer: D
    why:
      A: A bigger window still fills with excerpts instead of design.
      B: Planning without discovery produces a plan for the wrong code.
      C: Repeated compaction loses detail unpredictably mid-discovery.
      D: Isolating discovery keeps the excerpts out and the conclusions in.
  - id: q-3.4-d
    task: "3.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A plan has been approved. What is the correct execution pattern?
    options:
      A: Execute directly against the approved plan, and only re-plan if a finding invalidates it.
      B: Stay in plan mode and re-plan after each file so the plan stays current.
      C: Start a fresh session with no memory of the plan, to avoid bias.
      D: Have a second instance re-derive the plan before any edits.
    answer: A
    why:
      A: Plan to design, then execute directly, re-planning only on a genuine invalidation.
      B: Re-planning per file turns design into overhead and never converges.
      C: Discarding the approved plan wastes the work that produced it.
      D: A second derivation is redundant once the plan is approved.
  - id: q-3.4-e
    task: "3.4"
    level: 3
    scenario: Developer Productivity
    stem: >-
      A director asks why engineers should not simply plan everything, given
      that planning is cheap insurance. What is the honest answer?
    options:
      A: Planning consumes the context budget that execution needs.
      B: Planning pays off where there are real choices to make; on a clear small change it adds a review cycle and a document without changing the outcome.
      C: Plan mode cannot edit files, so nothing would ever ship.
      D: Plans go stale, so they are only valid for the session that wrote them.
    answer: B
    why:
      A: Cost is real but secondary to whether there is a decision to make.
      B: The deciding factor is whether the work has design space, not its risk in the abstract.
      C: Plan mode is followed by execution, so work does ship.
      D: Staleness is a reason to execute promptly, not a reason never to plan.
  - id: q-3.5-b
    task: "3.5"
    level: 1
    scenario: Code Generation
    stem: >-
      Output keeps missing the mark after three prose rewrites of the
      instruction. What is the better next step?
    options:
      A: Reword the instruction once more, more firmly.
      B: Shorten the instruction so it is easier to follow.
      C: Give a concrete input and the exact output wanted for it.
      D: Repeat the instruction at the start and the end.
    answer: C
    why:
      A: A fourth rewording is the trap this task names.
      B: Brevity does not supply the missing specificity.
      C: A concrete input and expected output removes the interpretation gap prose leaves.
      D: Repetition restates the same ambiguity twice.
  - id: q-3.5-c
    task: "3.5"
    level: 2
    scenario: Code Generation
    stem: >-
      Three issues in generated code are independent of one another. How should
      the feedback be delivered?
    options:
      A: One at a time, verifying after each, so each fix is attributable.
      B: As a rewritten specification covering all three implicitly.
      C: Only the most severe, and re-check whether the others persist.
      D: All three at once, since independent fixes cannot interfere.
    answer: D
    why:
      A: Sequencing independent fixes pays three round trips for no information.
      B: An implicit rewrite hides which problems were being addressed.
      C: Deferring known issues invites a second pass that was avoidable.
      D: Independent fixes batch safely; it is interacting fixes that need sequencing.
  - id: q-3.5-d
    task: "3.5"
    level: 3
    scenario: Code Generation
    stem: >-
      Two fixes interact: one changes a function's return type and the other
      changes how its callers handle errors. What is the right delivery?
    options:
      A: Sequence them, verifying the first before asking for the second, since the second depends on the shape the first produces.
      B: Batch them, because both touch the same function.
      C: Ask for both in one message but request separate commits.
      D: Ask a second instance to apply one while the first applies the other.
    answer: A
    why:
      A: When one fix changes what the other operates on, order carries information.
      B: Touching the same code is exactly why batching is unsafe here.
      C: Commit hygiene does not resolve the dependency between the changes.
      D: Concurrent edits to the same function conflict.
  - id: q-3.5-e
    task: "3.5"
    level: 3
    scenario: Code Generation
    stem: >-
      Work is starting in a domain nobody on the team knows well, and
      requirements are still vague. Which refinement pattern fits?
    options:
      A: Write the most detailed specification possible up front, then execute.
      B: Use the interview pattern — have the agent ask clarifying questions until the requirements are pinned down, then execute.
      C: Generate three candidate implementations and keep whichever reads best.
      D: Copy the structure of a similar project and adapt it.
    answer: B
    why:
      A: A detailed specification written from vague understanding encodes the wrong assumptions.
      B: Interviewing surfaces the unknowns before they are baked into a specification.
      C: Choosing by readability selects style rather than correctness.
      D: Borrowed structure imports assumptions from a different problem.
  - id: q-3.6-b
    task: "3.6"
    level: 1
    scenario: CI/CD
    stem: >-
      Which invocation is appropriate for a non-interactive CI job?
    options:
      A: The interactive session, with the job's input piped in.
      B: Plan mode, so the job records what it would do.
      C: The print flag, which runs a single non-interactive request and exits.
      D: A resumed session from the previous build.
    answer: C
    why:
      A: An interactive session in CI is the classic job that hangs waiting for input.
      B: Plan mode still expects an approval step.
      C: The print flag is the non-interactive mode CI needs.
      D: Resuming couples each build to the last build's context.
  - id: q-3.6-c
    task: "3.6"
    level: 2
    scenario: CI/CD
    stem: >-
      A CI gate needs to fail the build when any high-severity finding appears.
      What output format makes that reliable?
    options:
      A: Markdown, parsed with a regular expression for severity headings.
      B: The raw transcript, archived for a human to read.
      C: Plain text, with the job searching for the word critical.
      D: JSON output constrained by a schema, so the gate reads fields rather than prose.
    answer: D
    why:
      A: Regular expressions over prose break on the next formatting change.
      B: An archive is evidence, not a gate.
      C: Keyword searching misses rephrasings and matches quoted text.
      D: A schema-constrained payload is what makes a gate deterministic.
  - id: q-3.6-d
    task: "3.6"
    level: 3
    scenario: CI/CD
    stem: >-
      A review job reports the same twelve pre-existing findings on every pull
      request, and developers have stopped reading it. What is the fix?
    options:
      A: Feed the previously reported findings into the job and ask only for issues new to this change.
      B: Raise the severity threshold until the list is short.
      C: Run the job nightly rather than per pull request.
      D: Have the job comment only on files touched by the pull request.
    answer: A
    why:
      A: Passing prior findings back makes the output incremental, which is what restores trust.
      B: A higher threshold hides new findings along with old ones.
      C: Nightly runs delay feedback and still repeat the same list.
      D: File scoping helps, but a pre-existing issue in a touched file still repeats.
  - id: q-3.6-e
    task: "3.6"
    level: 3
    scenario: CI/CD
    stem: >-
      The same session that generated a change is asked to review it, and it
      approves everything. What is the structural problem?
    options:
      A: The session has run out of context and is summarising.
      B: A session reviewing its own work shares the assumptions that produced the defect, so an independent instance is needed.
      C: Review requires a different model, not a different session.
      D: The review prompt was not specific enough about severity levels.
    answer: B
    why:
      A: Context pressure is a separate problem from self-review bias.
      B: Independence is the whole point, because the reviewer must not share the generator's assumptions.
      C: A fresh instance of the same model is sufficient; the issue is shared context.
      D: Better severity wording does not remove the bias.

# ---------------------------------------------------------------------------
# D4 Prompt Engineering & Structured Output
