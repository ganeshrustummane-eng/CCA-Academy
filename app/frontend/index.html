<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Team learning app for the Claude Certified Architect (Foundations) exam: curriculum, practice, timed mock exam, hands-on labs and AI review." />
    <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c2613f'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <title>CCA Academy</title>
    <script>
      /* Set the theme before first paint so there is no light-to-dark flash. */
      try {
        var t = localStorage.getItem("cca.theme");
        if (!t || t === "system") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
